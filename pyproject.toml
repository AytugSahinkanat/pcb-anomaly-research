[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcb-anomaly-research"
version = "0.1.0"
description = "Evaluation guardrails for PCB component anomaly research"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "Pillow>=10.1,<13"]

[project.optional-dependencies]
features = ["torch==2.10.0", "torchvision==0.25.0"]
benchmark = ["faiss-cpu==1.15.1", "scipy==1.18.1", "tqdm==4.70.1", "timm==1.0.30", "matplotlib==3.11.2"]

[tool.setuptools.packages.find]
where = ["src"]

